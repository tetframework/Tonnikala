name: Build and Release

on:
  push:
    branches: [ release ]
    tags: [ 'v*' ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # use the latest 3.15 release candidate until 3.15.0 is out
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pytest pytest-cov flake8
          python -m pip install -e .[javascript]

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 tonnikala tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 tonnikala tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        # Deprecation warnings fail the build. importlib.resources.read_binary()
        # warns only on Python 3.11: it was undeprecated in 3.13 and 3.12.10.
        run: |
          python -m pytest -v -W error::DeprecationWarning -W error::PendingDeprecationWarning -W "ignore:read_binary is deprecated:DeprecationWarning"

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    env:
      # Skip 32-bit builds, musllinux i686 and free-threaded builds
      CIBW_SKIP: "*-win32 *-musllinux_i686 cp3??t-*"
      # Use manylinux2014 for C extensions (Linux only)
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
      CIBW_MANYLINUX_I686_IMAGE: manylinux2014
      CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
      CIBW_MANYLINUX_PPC64LE_IMAGE: manylinux2014
      CIBW_MANYLINUX_S390X_IMAGE: manylinux2014
      # Install test dependencies
      CIBW_TEST_REQUIRES: "pytest setuptools slimit3k ply"
      # Run tests; deprecation warnings fail the build, see the test job
      CIBW_TEST_COMMAND: >-
        pytest -W error::DeprecationWarning -W error::PendingDeprecationWarning
        -W "ignore:read_binary is deprecated:DeprecationWarning" {project}/tests
      # Build settings
      CIBW_BUILD_VERBOSITY: 1

    steps:
      - uses: actions/checkout@v7

      # cibuildwheel 4 dropped Python 3.8 and cibuildwheel 3 cannot build
      # Python 3.15, so the wheels are built in two steps.
      - name: Build wheels for Python 3.8
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: "cp38-*"

      - name: Build wheels for Python 3.9-3.15
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_pure_wheel:
    name: Build pure Python wheel (no C extension)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build pure Python wheel
        run: |
          python -m pip install --upgrade pip build wheel
          # Force pure Python universal wheel
          TONNIKALA_DISABLE_SPEEDUPS=1 python -m build --wheel
          # Use wheel tool to convert to universal; --remove drops the original
          # linux_x86_64 wheel, which PyPI rejects
          cd dist
          wheel tags --remove --python-tag py3 --abi-tag none --platform-tag any *.whl

      - uses: actions/upload-artifact@v7
        with:
          name: pure-wheel
          path: dist/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  upload_pypi:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    needs: [build_wheels, build_pure_wheel, build_sdist]
    # Only upload on tags AND require manual approval via protected environment
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi-release
      url: https://pypi.org/project/tonnikala/
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          find dist -name "*.whl" -exec mv {} dist/ \;
          find dist -name "*.tar.gz" -exec mv {} dist/ \;
          find dist -mindepth 1 -type d -exec rm -rf {} + 2>/dev/null || true
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # No password needed with OIDC trusted publisher
          skip-existing: true
