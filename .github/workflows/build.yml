name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # use the latest 3.15 release candidate until 3.15.0 is out
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pytest pytest-cov flake8
          python -m pip install -e .[javascript]

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 tonnikala tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 tonnikala tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        # Deprecation warnings fail the build. importlib.resources.read_binary()
        # warns only on Python 3.11: it was undeprecated in 3.13 and 3.12.10.
        run: |
          python -m pytest -v -W error::DeprecationWarning -W error::PendingDeprecationWarning -W "ignore:read_binary is deprecated:DeprecationWarning"
